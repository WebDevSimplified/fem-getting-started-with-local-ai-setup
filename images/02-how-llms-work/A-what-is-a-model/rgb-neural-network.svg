  <line class="line" x1="180" y1="350" x2="380" y2="110" />
  <line class="line" x1="180" y1="350" x2="380" y2="195" />
  <line class="line" x1="180" y1="350" x2="380" y2="285" />
  <line class="line" x1="180" y1="350" x2="380" y2="370" />
  <line class="line" x1="440" y1="110" x2="685" y2="110" />
