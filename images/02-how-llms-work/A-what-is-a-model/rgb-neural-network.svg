<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img"
  aria-labelledby="title description">
  <title id="title">RGB neural network</title>
  <desc id="description">Red, green, and blue inputs connect through two hidden layers to darker RGB
    outputs. The connections between nodes are learned weights.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #172033; }
    .label { font-size: 22px; font-weight: 700; }
    .sub { font-size: 17px; fill: #526071; }
    .line { stroke: #9aa8bb; stroke-width: 3; }
    .node { stroke: #172033; stroke-width: 3; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9aa8bb" />
    </marker>
  </defs>
  <rect width="1200" height="450" fill="#f6f8fb" />
  <text x="90" y="58" class="label">Input Nodes</text>
  <text x="340" y="58" class="label">Hidden Layer 1</text>
  <text x="640" y="58" class="label">Hidden Layer 2</text>
  <text x="965" y="58" class="label">Output Nodes</text>
