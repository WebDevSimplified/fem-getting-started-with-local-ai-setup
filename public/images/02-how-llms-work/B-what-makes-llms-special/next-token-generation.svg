<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img"
  aria-labelledby="title description">
  <title id="title">Next-token generation loop</title>
  <desc id="description">A prompt enters an LLM, the model assigns probabilities to next tokens,
    selects Paris, then adds it to the prompt and repeats.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #172033; }
    .label { font-size: 20px; font-weight: 700; }
    .sub { font-size: 17px; fill: #526071; }
    .arrow { stroke: #526071; stroke-width: 2; fill: none; }
  </style>
  <rect width="960" height="430" fill="#f6f8fb" />
  <rect x="45" y="150" width="220" height="105" rx="6" fill="#fff" stroke="#172033" stroke-width="3" />
  <text x="75" y="190" class="label">The capital of</text>
  <text x="75" y="220" class="label">France is</text>
  <path class="arrow" d="M275 202h75" />
  <path d="M350 202l-16-11v22z" fill="#526071" />
  <rect x="370" y="110" width="190" height="185" rx="8" fill="#dbeafe" stroke="#172033"
    stroke-width="3" />
  <text x="425" y="180" class="label">LLM</text>
  <text x="400" y="215" class="sub">processes context</text>
  <path class="arrow" d="M570 202h65" />
  <path d="M635 202l-16-11v22z" fill="#526071" />
  <rect x="655" y="100" width="255" height="205" rx="8" fill="#fff" stroke="#172033"
    stroke-width="3" />
  <text x="670" y="142" class="label">Next-token probabilities</text>
  <text x="700" y="185" class="sub">Paris 92%</text>
  <rect x="795" y="168" width="85" height="20" fill="#22c55e" />
  <text x="700" y="225" class="sub">London 3%</text>
  <rect x="795" y="208" width="15" height="20" fill="#94a3b8" />
  <text x="700" y="265" class="sub">Rome 1%</text>
  <rect x="795" y="248" width="7" height="20" fill="#94a3b8" />
  <path class="arrow" d="M780 320c0 67-345 72-510 35" />
  <path d="M270 355l17-9-5 20z" fill="#526071" />
  <text x="330" y="405" class="sub">Choose a token, add it to the context, and predict again.</text>
</svg>