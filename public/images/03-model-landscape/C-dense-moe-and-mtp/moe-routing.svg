<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img"
  aria-labelledby="title desc">
  <title id="title">A mixture-of-experts model routes code tokens to selected experts</title>
  <desc id="desc">A code prompt enters a router. The router activates a frontend JavaScript expert
    and a Python expert while other experts remain inactive. Selected experts return results to the
    model output.</desc>
  <style>
    .heading { font: 700 26px sans-serif; fill: #172033; }
    .label { font: 600 17px sans-serif; fill: #172033; }
    .body { font: 15px sans-serif; fill: #44516a; }
    .small { font: 13px sans-serif; fill: #44516a; }
    .box { stroke: #172033; stroke-width: 2; rx: 12; }
    .inactive-box { stroke: #aab4c4; stroke-width: 2; rx: 12; }
    .inactive-label { font: 600 17px sans-serif; fill: #7d899b; }
    .arrow { fill: none; stroke: #172033; stroke-width: 3; }
    .muted-arrow { fill: none; stroke: #aab4c4; stroke-width: 2; stroke-dasharray: 6 6; }
  </style>
  <rect width="1000" height="570" fill="#f8fafc" />
  <text x="40" y="46" class="heading">Only selected experts process each token</text>
  <rect x="40" y="112" width="220" height="136" class="box" fill="#dbeafe" />
  <text x="62" y="148" class="label">Code prompt</text>
  <text x="62" y="178" class="body">"Create a React component,</text>
  <text x="62" y="202" class="body">then write a Python test"</text>
  <path d="M260 180 H330" class="arrow" />
  <rect x="330" y="112" width="190" height="136" class="box" fill="#fef3c7" />
  <text x="352" y="154" class="label">Router</text>
  <text x="352" y="184" class="body">Scores every expert</text>
  <text x="352" y="208" class="body">and selects a few</text>
  <text x="580" y="96" class="small">Active experts</text>
  <rect x="580" y="112" width="240" height="82" class="box" fill="#dcfce7" />
  <text x="602" y="145" class="label">Frontend JS expert</text>
  <text x="602" y="169" class="body">Selected for React code</text>
  <path d="M520 150 H580" class="arrow" />
  <rect x="580" y="236" width="240" height="82" class="box" fill="#dcfce7" />
  <text x="602" y="269" class="label">Python expert</text>
  <text x="602" y="293" class="body">Selected for test code</text>
  <path d="M520 210 C554 210 546 277 580 277" class="arrow" />
  <text x="580" y="370" class="small">Inactive experts</text>
  <rect x="580" y="386" width="240" height="64" class="inactive-box" fill="#eef2f7" />
  <text x="602" y="425" class="inactive-label">SQL expert</text>
  <path d="M520 224 C556 224 548 418 580 418" class="muted-arrow" />
  <rect x="580" y="476" width="240" height="64" class="inactive-box" fill="#eef2f7" />
  <text x="602" y="515" class="inactive-label">Translation expert</text>
  <path d="M520 232 C560 232 548 508 580 508" class="muted-arrow" />
  <path d="M820 153 H852 V220 H870" class="arrow" />
  <path d="M820 277 H852 V260 H870" class="arrow" />
  <rect x="870" y="194" width="92" height="94" class="box" fill="#e0e7ff" />
  <text x="890" y="230" class="label">Next</text>
  <text x="887" y="254" class="label">token</text>
</svg>