<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" role="img"
  aria-labelledby="title desc">
  <title id="title">Quantizing one weight from 16 bits to 8 bits and 4 bits</title>
  <style>
    text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:32px;font-weight:700}.label{font-size:26px;font-weight:700}.small{font-size:20px;fill:#475569}.bit{font-family:monospace;font-size:22px;font-weight:700}.value{font-size:22px;font-weight:700}.box{stroke:#172033;stroke-width:2}.arrow{stroke:#64748b;stroke-width:3;fill:none}.scale{stroke:#172033;stroke-width:4}.tick{stroke:#64748b;stroke-width:2}.marker{fill:#e11d48;stroke:#fff;stroke-width:4}
  </style>
  <rect width="1000" height="820" fill="#f8fafc" />
  <text class="title" x="55" y="55">Quantization stores each weight with fewer bits</text>

  <text class="label" x="55" y="145">16-bit weight</text>
  <text class="small" x="55" y="173">More bits preserve a more precise value.</text>
  <text class="small" x="510" y="132" text-anchor="middle">sign</text>
  <text class="small" x="655" y="132" text-anchor="middle">exponent</text>
  <text class="small" x="845" y="132" text-anchor="middle">precision bits</text>
  <rect class="box" x="475" y="145" width="70" height="46" rx="5" fill="#bbf7d0" />
  <text class="bit" x="510" y="176" text-anchor="middle">0</text>
  <rect class="box" x="555" y="145" width="200" height="46" rx="5" fill="#fecaca" />
  <text class="bit" x="655" y="176" text-anchor="middle">10101</text>
  <rect class="box" x="765" y="145" width="180" height="46" rx="5" fill="#bfdbfe" />
  <text class="bit" x="855" y="176" text-anchor="middle">1011010110</text>
  <line class="scale" x1="250" y1="245" x2="900" y2="245" />
  <line class="tick" x1="250" y1="230" x2="250" y2="260" />
  <line class="tick" x1="575" y1="230" x2="575" y2="260" />
  <line class="tick" x1="900" y1="230" x2="900" y2="260" />
  <text class="small" x="250" y="290" text-anchor="middle">-1</text>
  <text class="small" x="575" y="290" text-anchor="middle">0</text>
  <text class="small" x="900" y="290" text-anchor="middle">1</text>
  <circle class="marker" cx="714" cy="245" r="11" />
  <text class="value" x="714" y="220" text-anchor="middle" fill="#e11d48">0.4287</text>

  <path class="arrow" d="M575 310v35m-14-14 14 14 14-14" />

  <text class="label" x="55" y="395">8-bit quantized weight</text>
  <text class="small" x="55" y="423">The value is placed in one of 256 available levels.</text>
  <rect class="box" x="725" y="375" width="220" height="46" rx="5" fill="#bfdbfe" />
  <text class="bit" x="835" y="406" text-anchor="middle">10110110</text>
  <line class="scale" x1="250" y1="475" x2="900" y2="475" />
  <line class="tick" x1="250" y1="460" x2="250" y2="490" />
  <line class="tick" x1="575" y1="460" x2="575" y2="490" />
  <line class="tick" x1="900" y1="460" x2="900" y2="490" />
  <text class="small" x="250" y="520" text-anchor="middle">-1</text>
  <text class="small" x="575" y="520" text-anchor="middle">0</text>
  <text class="small" x="900" y="520" text-anchor="middle">1</text>
  <circle class="marker" cx="714" cy="475" r="11" />
  <text class="value" x="714" y="450" text-anchor="middle" fill="#e11d48">0.4275</text>

  <path class="arrow" d="M575 540v35m-14-14 14 14 14-14" />

  <text class="label" x="55" y="625">4-bit quantized weight</text>
  <text class="small" x="55" y="653">The same range has 16 levels, so the closest value can be
    farther away.</text>
  <rect class="box" x="835" y="605" width="110" height="46" rx="5" fill="#bfdbfe" />
  <text class="bit" x="890" y="636" text-anchor="middle">1011</text>
  <line class="scale" x1="250" y1="710" x2="900" y2="710" />
  <line class="tick" x1="250" y1="695" x2="250" y2="725" />
  <line class="tick" x1="575" y1="695" x2="575" y2="725" />
  <line class="tick" x1="900" y1="695" x2="900" y2="725" />
  <text class="small" x="250" y="755" text-anchor="middle">-1</text>
  <text class="small" x="575" y="755" text-anchor="middle">0</text>
  <text class="small" x="900" y="755" text-anchor="middle">1</text>
  <circle class="marker" cx="705" cy="710" r="11" />
  <text class="value" x="705" y="685" text-anchor="middle" fill="#e11d48">0.4000</text>
</svg>